[plugin]
enabled = true
config_version = "1.1.0"

[schedule]
timezone = ""
check_interval_seconds = 15
block_media_ai = true
block_background_emoji_maintenance = true

[[schedule.rules]]
name = "DeepSeek 早高峰"
enabled = true
start_time = "09:00"
end_time = "12:00"
day_scope = "workday"
weekdays = [
    1,
    2,
    3,
    4,
    5,
]
respect_holiday_skip = true
notify_on_start = true
notify_on_end = true
start_message = ""
end_message = ""
mode = "inherit"
fallback_models = []

[[schedule.rules]]
name = "DeepSeek 午高峰"
enabled = true
start_time = "14:00"
end_time = "18:00"
day_scope = "workday"
weekdays = [
    1,
    2,
    3,
    4,
    5,
]
respect_holiday_skip = true
notify_on_start = true
notify_on_end = true
start_message = ""
end_message = ""
mode = "inherit"
fallback_models = []

[model_fallback]
enabled = true
# 在 MaiBot 中已注册的模型名列表（例如 ["deepseek-v4-flash"]）。
# 填写后进入规则时段将切换为对应模型且不进行静默；留空或无可用模型时自动按静默规则拦截。
fallback_models = []
target_tasks = [
    "replyer",
    "planner",
    "utils",
    "memory",
    "learner",
    "fast_model",
]
switch_mode = "replace"
fallback_to_quiet_if_unavailable = true
instance_root = ""

[holiday]
enabled = true
skip_quiet_on_holidays = false
treat_makeup_as_workday = true
enable_online_sync = true
sync_timeout_seconds = 8.0
custom_api_url = ""
custom_holidays = []
custom_workdays = []

[notices]
enabled = true
notify_on_startup_if_quiet = false
default_start_message = "💤 现已进入 AI 静默时段（原因：{rule_name}，预计 {end_time} 恢复）。\n期间 AI 聊天与依赖大模型的插件已暂停，不经过大模型的指令功能仍可正常使用。"
default_end_message = "💡 AI 静默时段（{rule_name}）已结束，AI 聊天与大模型能力已恢复正常！"
target_mode = "all_non_exempt_groups"
target_groups = []
target_users = []
exclude_platforms = [
    "local",
    "webui",
    "internal",
]
blocked_chat_reply = ""
only_reply_chat_when_mentioned_or_private = true
blocked_reply_cooldown_seconds = 300
blocked_plugin_reply = "⏸️ 当前处于 AI 静默时段（{rule_name}，预计 {end_time} 恢复），命令 /{command_name} 所属插件（{plugin_name}）依赖大模型能力，已暂时阻断。"
fallback_enter_notice = ""
fallback_exit_notice = ""

[plugin_guard]
enabled = true
block_mode = "smart"
enable_ast_code_scan = true
treat_model_list_capability_as_llm = false
rescan_interval_seconds = 300
force_block_plugins = []
force_allow_plugins = []
force_allow_commands = []

[exemptions]
exempt_groups = []
exempt_users = []
user_exempt_in_group = true
exempt_platforms = [
    "local",
    "webui",
    "internal",
]
